name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }}
      - name: core is dependency-free
        # the whole point of the package is that none of this needs torch
        run: |
          uv run python - <<'PY'
          import sys
          import textscore

          heavy = [m for m in ("torch", "transformers", "numpy", "sklearn", "datasets") if m in sys.modules]
          assert not heavy, f"heavy import leaked: {heavy}"
          print("core imports clean, no heavy dependency reachable")
          PY
      - run: uv run pytest -q
